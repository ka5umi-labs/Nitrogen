# bundled-mods.toml —— 打包分发的模组清单
#
# 这些模组不能用下载链接（Modrinth 只接受 cdn.modrinth.com），
# 因此 jar 直接放在 mods/ 下，由 packwiz 在 mr export 时自动
# 打包进 overrides/mods/。
#
# 【重要】务必不要把 jar 放进 overrides/ 目录 —— packwiz 会把它
# 导出成 overrides/overrides/mods/，玩家装了不生效。jar 必须放
# mods/ 下。（已实测确认）
#
# 更新方式见 docs/bundled-mods.md。

[[mod]]
name = "Connectivity"
file = "connectivity-fabric-26.3-7.7.jar"
side = "both"
license = "ARR"
author = "Someaddon"
source = "curseforge"
source_id = 470193
source_file_id = 9011123
source_url = "https://www.curseforge.com/minecraft/mc-mods/connectivity/files/9011123"
note = "优化网络连接与包处理的纯性能模组。已核实不注册自定义通道，仅 mixin 原版包做日志与包名美化（见 docs/decisions）。"
update = "手动。CurseForge 页面下载新文件，替换 mods/ 下 jar 后跑 packwiz refresh"

